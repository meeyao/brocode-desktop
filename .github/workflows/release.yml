name: Brocode Release

# Builds, signs, notarizes, and publishes Brocode (apps/desktop) to
# https://anoma.ly/release (docs/releasing.md), split the way Hex's and OpenCode's releases are:
#
# - build and verify jobs run repository code with no environment, secrets, or id-token, and
#   produce unsigned files.
# - sign and publish jobs run in the `release` environment (deployment branch: dev only), check
#   out only /.github/release/ at github.sha, run only those scripts and SHA-pinned actions, and
#   treat artifacts strictly as SHA-256-verified data. Their secrets come from AWS Secrets Manager
#   through GitHub OIDC (role github/opencode-rune-release, anomalyco/secrets), step-scoped: the
#   AWS session is only a step output of configure-aws-credentials, passed to the one step that
#   reads secrets (.github/release/with-secrets.sh). The environment holds only non-secret
#   variables (AZURE_*, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID).
# - every artifact carries a SHA256SUMS whose digest the job that made it reports as an output;
#   every job that downloads it checks that digest (.github/release/verify-artifacts.sh).
#
# This file and .github/release/ are the security boundary for releases; changing .github/ needs
# Dax (.github/CODEOWNERS and the `release boundary (.github needs Dax)` ruleset). The release
# service authorizes publish jobs by their OIDC token: anomalyco/opencode-rune, this file,
# refs/heads/dev, environment release (anomalyco/release registry/opencode.json for desktop and
# registry/opencode-rune.json for browser-engine).
#
# Scheduled dev checks follow the official desktop's six-hour cadence. Only plan runs when
# no app or engine files changed and the live browser-engine index already serves this commit's
# engines. Each desktop or engine publish replaces the whole channel in one request.
# - workflow_dispatch from dev builds now, whatever changed: check (build, sign, verify desktop
#   and browser engines; publish nothing), dev, or engine (browser engines only; refuses if this
#   commit's version is already complete in the live index).
# - dev is the only desktop channel; there is no stable. Every dev release, once it is on the
#   release service, is tagged v0.0.0-dev-<n> and mirrored byte for byte to a GitHub release
#   marked latest. Tags start nothing.
#
# A run always releases the commit it runs on (github.sha): there is no ref input, every job
# checks out github.sha, and the plan fails unless that is the commit it checked out on dev.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Run from dev. check (build and verify), dev (desktop), or engine (browser engines)
        type: choice
        options: [check, dev, engine]
        default: check

run-name: >-
  ${{ (github.event_name == 'schedule' || inputs.channel == 'dev') && 'dev: full desktop matrix'
  || inputs.channel == 'engine' && 'browser engine release'
  || 'check: full desktop matrix' }}

permissions:
  contents: read

# Finish the active release; only the newest pending run per channel waits.
concurrency:
  group: opencode-rune-${{ inputs.channel || 'dev' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SEER_TEAM_ID: 5NZ4Q7NXJ4
  # A release build starts from the cache, not from an earlier build of its own: incremental
  # state only makes CI's build slower and its cache larger.
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      service: ${{ steps.plan.outputs.service }}
      tag: ${{ steps.plan.outputs.tag }}
      notes-url: ${{ steps.plan.outputs.notes-url }}
      release-channel: ${{ steps.plan.outputs.release-channel }}
      release-version: ${{ steps.plan.outputs.release-version }}
      build-desktop: ${{ steps.plan.outputs.build-desktop }}
      engine-version: ${{ steps.plan.outputs.engine-version }}
      engine-release-version: ${{ steps.plan.outputs.engine-release-version }}
      build-engine: ${{ steps.plan.outputs.build-engine }}
      linux-x64-sha256: ${{ steps.plan.outputs.linux-x64-sha256 }}
      linux-arm64-sha256: ${{ steps.plan.outputs.linux-arm64-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.github/release/
            /apps/browser-engine/Cargo.lock
            /crates/browser-pane/src/installer.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: SHA=$(git rev-parse HEAD) bash .github/release/opencode-rune-plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
          GH_TOKEN: ${{ github.token }}

  # Which signing values the release environment holds, read on Linux, so a Windows or macOS
  # runner is booked only to sign. Every desktop or engine channel requires both. The Apple
  # certificate and notary key aren't here: they're read from AWS in the signing step itself,
  # which fails if either is empty.
  credentials:
    needs: plan
    if: ${{ needs.plan.outputs.build-desktop == 'true' || needs.plan.outputs.build-engine == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: release
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing() { for name in "$@"; do [ -n "$(printenv "$name")" ] || printf ' %s' "$name"; done; }
          azure=$(missing AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE)
          apple=$(missing APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID)
          if [ -n "$azure$apple" ]; then
            echo "::error::Desktop releases need signed Windows and macOS builds; the release environment lacks:$azure$apple."
            exit 1
          fi

  # ---- Build: repository code; no environment, secrets, or id-token ----------

  build-macos:
    needs: [plan, credentials]
    if: ${{ needs.plan.outputs.build-desktop == 'true' }}
    strategy: &mac-strategy
      matrix:
        include:
          - { arch: arm64, host: blacksmith-6vcpu-macos-26 }
          - { arch: x64, host: macos-26-intel }
    # Cross-build x86_64-apple-darwin on fast Apple Silicon (like build-windows cross-builds arm64);
    # verify-macos still runs on matrix.host (macos-26-intel for x64) for real native verification.
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
      OPENCODE_RUNE_TARGET: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      OPENCODE_RUNE_PROFILE: release-thin
    outputs: &arch-digests
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - &build-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain; x64 cross-builds on the arm64 runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = arm64 ] || rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-${{ matrix.arch }}-${{ env.OPENCODE_RUNE_PROFILE }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # The terminal's libghostty-vt, and the Zig that builds it, live outside target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/seer/ghostty-vt
          key: ghostty-vt-macos-${{ matrix.arch }}-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - id: zig
        name: Zig version
        run: |
          version=$(sed -n 's/^pub const ZIG_VERSION: &str = "\(.*\)";$/\1/p' crates/terminal/build_support.rs)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not read ZIG_VERSION from crates/terminal/build_support.rs." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The Zig toolchain on its own, keyed on its version alone: ghostty-vt's key follows
      # build.rs and build_support.rs, so without this every change there downloads Zig again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/seer/ghostty-vt/zig-*-${{ steps.zig.outputs.version }}
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}
      - name: Install NASM for the x86 video decoder
        if: matrix.arch == 'x64'
        run: brew install nasm
      - name: Build Brocode.app
        run: |
          apps/desktop/scripts/set-crate-version.sh "$PWD" "$OPENCODE_RUNE_VERSION"
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/macos"
          apps/desktop/scripts/build-app.sh "$RUNNER_TEMP/app"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$RUNNER_TEMP/app/Brocode.app"
          fi
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/app/Brocode.app" "$RUNNER_TEMP/macos/OpenCode-Rune.app.zip"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos
          retention-days: "7"
      - &report-digest
        id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: [plan, credentials, build-engine-linux]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.build-desktop == 'true'
      && needs.credentials.result == 'success'
      && (needs.plan.outputs.build-engine != 'true' || needs.build-engine-linux.result == 'success') }}
    strategy:
      matrix:
        include:
          - { arch: x64, host: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, host: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
      linux-x64-engine-sha256: ${{ steps.engine-trust.outputs.linux-x64-engine-sha256 }}
      linux-arm64-engine-sha256: ${{ steps.engine-trust.outputs.linux-arm64-engine-sha256 }}
    steps:
      - *build-checkout
      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config nasm libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libdbus-1-dev libudev-dev libssl-dev rpm squashfs-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/seer/ghostty-vt
          key: ghostty-vt-linux-${{ matrix.arch }}-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - id: zig
        name: Zig version
        run: |
          version=$(sed -n 's/^pub const ZIG_VERSION: &str = "\(.*\)";$/\1/p' crates/terminal/build_support.rs)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not read ZIG_VERSION from crates/terminal/build_support.rs." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The Zig toolchain on its own, keyed on its version alone: ghostty-vt's key follows
      # build.rs and build_support.rs, so without this every change there downloads Zig again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/seer/ghostty-vt/zig-*-${{ steps.zig.outputs.version }}
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}
      - id: engine-trust
        name: Resolve Linux ${{ matrix.arch }} browser engine sha256 pin
        env:
          PINNED_SHA256: ${{ needs.plan.outputs.build-engine == 'true' && needs.build-engine-linux.outputs[format('sha256-{0}', matrix.arch)] || needs.plan.outputs[format('linux-{0}-sha256', matrix.arch)] }}
        run: |
          [[ "$PINNED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid Linux ${{ matrix.arch }} browser engine sha256 '$PINNED_SHA256'." >&2; exit 1; }
          echo "linux-${{ matrix.arch }}-engine-sha256=$PINNED_SHA256" >> "$GITHUB_OUTPUT"
      - name: Build and package desktop
        env:
          LINUX_ENGINE_SHA256: ${{ steps.engine-trust.outputs[format('linux-{0}-engine-sha256', matrix.arch)] }}
        run: |
          export OPENCODE_BROWSER_ENGINE_TRUST="sha256:$LINUX_ENGINE_SHA256"
          apps/desktop/scripts/set-crate-version.sh "$PWD" "$OPENCODE_RUNE_VERSION"
          cargo build --locked -p opencode-desktop --profile release-quick
          bash apps/desktop/scripts/package-linux.sh target/release-quick/opencode-desktop "$RUNNER_TEMP/linux"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux
          retention-days: "7"
      - *report-digest

  build-windows:
    needs: [plan, credentials]
    if: ${{ needs.plan.outputs.build-desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 120
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    # One output per arch: a matrix job's outputs are shared by its legs.
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain; arm64 cross-builds on the x64 runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # The terminal's libghostty-vt, and the Zig that builds it, live outside target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/seer/ghostty-vt
          key: ghostty-vt-windows-${{ matrix.arch }}-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - id: zig
        name: Zig version
        run: |
          version=$(sed -n 's/^pub const ZIG_VERSION: &str = "\(.*\)";$/\1/p' crates/terminal/build_support.rs)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Could not read ZIG_VERSION from crates/terminal/build_support.rs." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The Zig toolchain on its own, keyed on its version alone: ghostty-vt's key follows
      # build.rs and build_support.rs, so without this every change there downloads Zig again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/seer/ghostty-vt/zig-*-${{ steps.zig.outputs.version }}
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}
      - name: Build the setup and the update zip
        shell: pwsh
        run: apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/windows" -Arch ${{ matrix.arch }}
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-opencode-rune-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # The setup around the install folder sign-windows signed, so it installs the same signed files
  # the updater downloads. Repository code: a build, after the signing job (as OpenCode's
  # build-desktop-windows-installer); sign-windows-setup signs the setup next.
  package-windows:
    needs: [plan, sign-windows]
    if: ${{ !cancelled() && needs.sign-windows.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 60
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      # No cache: the setup and its few dependencies build in less time than a cache takes to
      # restore and save, and the app's caches keep the repository's 10 GB.
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
      - name: Build the setup around the signed zip
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows-app/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-${{ matrix.arch }}.zip"
          apps/installer/scripts/package.ps1 -Out "$env:RUNNER_TEMP/setup" -Arch ${{ matrix.arch }} -Payload $zip
      # Not build-opencode-rune-windows-*: that pattern names the unsigned builds.
      - id: upload
        uses: ./.github/release/upload
        with:
          name: setup-opencode-rune-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/setup
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---- Sign: release environment; only .github/release/ is checked out -------

  # Authenticode-signs opencode-desktop.exe and every program and library of the install folders
  # through Azure Artifact Signing, as OpenCode's and Hex's
  # release workflows do (GitHub OIDC into the release environment's AZURE_* values), then zips the
  # signed folders: the updater's windows-<arch> targets, which it checks against
  # updater::windows::EXPECTED_PUBLISHER. package-windows builds the setups around those zips and
  # sign-windows-setup signs them.
  sign-windows:
    needs: [plan, build-windows]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: &windows-sign-env
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      ARCHES: x64 arm64
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - &checkout-release
        name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the unsigned builds
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-windows-*
          digests: >-
            build-opencode-rune-windows-x64=${{ needs.build-windows.outputs.digest-x64 }}
            build-opencode-rune-windows-arm64=${{ needs.build-windows.outputs.digest-arm64 }}
      - name: Unpack the install folders
        shell: pwsh
        run: |
          foreach ($arch in $env:ARCHES -split ' ') {
            Expand-Archive -LiteralPath "$env:RUNNER_TEMP/in/build-opencode-rune-windows-$arch/OpenCode-Rune-$env:VERSION-windows-$arch.zip" -DestinationPath "$env:RUNNER_TEMP/work/windows-$arch"
          }
      - &azure-login
        name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - &azure-sign
        name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Brocode
          description-url: https://github.com/anomalyco/opencode-rune
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          # Fetch the signing tools fresh: the Actions cache is shared with build jobs that run
          # repository code, so a restored entry could be a poisoned module run here.
          cache-dependencies: false
      - &azure-verify
        name: Check the signatures
        shell: pwsh
        run: .github/release/opencode-rune-verify-windows.ps1 -Folders "$env:RUNNER_TEMP/work"
      - name: Zip the signed install folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/out" | Out-Null
          foreach ($arch in $env:ARCHES -split ' ') {
            Compress-Archive -Path "$env:RUNNER_TEMP/work/windows-$arch/*" -DestinationPath "$env:RUNNER_TEMP/out/OpenCode-Rune-$env:VERSION-windows-$arch.zip"
          }
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows-app
          path: ${{ runner.temp }}/out

  sign-windows-setup:
    needs: [plan, sign-windows, package-windows]
    if: ${{ !cancelled() && needs.sign-windows.result == 'success' && needs.package-windows.result == 'success' }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env: *windows-sign-env
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - name: Download the setups
        uses: ./.github/release/download
        with:
          pattern: setup-opencode-rune-windows-*
          digests: >-
            setup-opencode-rune-windows-x64=${{ needs.package-windows.outputs.digest-x64 }}
            setup-opencode-rune-windows-arm64=${{ needs.package-windows.outputs.digest-arm64 }}
      - name: Download the signed zips
        uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows-app
          digests: sign-opencode-rune-windows-app=${{ needs.sign-windows.outputs.digest }}
          folder: app
      - name: Gather the setups
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/work" && cp "$temp"/in/setup-opencode-rune-windows-*/*.exe "$temp/work/"
      - *azure-login
      - *azure-sign
      - *azure-verify
      - name: Gather the release files
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/out" && cp "$temp"/work/*.exe "$temp"/app/sign-opencode-rune-windows-app/*.zip "$temp/out/"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-windows
          path: ${{ runner.temp }}/out

  # Developer ID signing and notarization, whenever this run built macOS; booked only when the
  # release environment holds the notary IDs (`credentials`).
  sign-macos:
    needs: [plan, build-macos]
    strategy: *mac-strategy
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    outputs: *arch-digests
    steps:
      - *checkout-release
      - name: Download unsigned app
        uses: ./.github/release/download
        with:
          pattern: build-opencode-rune-macos-${{ matrix.arch }}
          digests: build-opencode-rune-macos-${{ matrix.arch }}=${{ needs.build-macos.outputs[format('digest-{0}', matrix.arch)] }}
      # AWS credentials only as this action's step outputs (never in the job's environment), for
      # the one step below that reads the secrets.
      - id: aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-rune-release
          role-session-name: opencode-rune-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true
      - name: Import the certificate and notary key
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          bash .github/release/with-secrets.sh \
            APPLE_SIGNING_CERTIFICATE=shared/APPLE_SIGNING_CERTIFICATE \
            APPLE_NOTARY_KEY=shared/APPLE_NOTARY_KEY \
            -- bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
      - name: Sign, notarize, and staple
        run: bash .github/release/opencode-rune-sign-macos.sh "$RUNNER_TEMP/in/build-opencode-rune-macos-${{ matrix.arch }}/OpenCode-Rune.app.zip" "$RUNNER_TEMP/out" "${{ matrix.arch }}"
        env:
          SEER_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          SEER_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-opencode-rune-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
      - *report-digest

  # ---- Verify: repository code on the signed files; no secrets ---------------

  verify-macos:
    needs: [plan, sign-macos]
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' }}
    strategy: *mac-strategy
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-macos-${{ matrix.arch }}
          digests: sign-opencode-rune-macos-${{ matrix.arch }}=${{ needs.sign-macos.outputs[format('digest-{0}', matrix.arch)] }}
      - name: Verify signed app, updater zip, and DMG
        run: |
          stem="$RUNNER_TEMP/in/sign-opencode-rune-macos-${{ matrix.arch }}/OpenCode-Rune-$OPENCODE_RUNE_VERSION-macos-${{ matrix.arch }}"
          dmg="$stem.dmg"
          zip="$stem.zip"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          check=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$check/dmg" "$dmg"
          /usr/bin/ditto -x -k "$zip" "$check/update"
          apps/desktop/scripts/validate-app.sh "$check/dmg/Brocode.app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          apps/desktop/scripts/validate-app.sh "$check/update/Brocode.app" "$OPENCODE_RUNE_VERSION" "$OPENCODE_RUNE_BUILD_CHANNEL"
          xcrun stapler validate "$check/update/Brocode.app"
          codesign --verify --deep --strict -R="$(cat apps/desktop/update-requirement.txt)" "$check/update/Brocode.app"
          spctl --assess --type execute --verbose=2 "$check/dmg/Brocode.app"
          diff -qr "$check/dmg/Brocode.app" "$check/update/Brocode.app"
          OPENCODE_RUNE_SMOKE_HEADLESS=1 apps/desktop/scripts/smoke-app.sh "$check/dmg/Brocode.app"
          hdiutil detach -quiet "$check/dmg" || hdiutil detach -force -quiet "$check/dmg"
          codesign -dv "$check/update/Brocode.app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority=Developer)' >> "$GITHUB_STEP_SUMMARY"

  # The publisher every signed file carries must be the one the updater checks, read from the app.
  verify-windows:
    needs: [plan, sign-windows-setup]
    if: ${{ !cancelled() && needs.sign-windows-setup.result == 'success' }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      OPENCODE_RUNE_VERSION: ${{ needs.plan.outputs.release-version }}
      OPENCODE_RUNE_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
      ARCHES: x64 arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.github/release/
            /features/updater/src/windows.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
      - name: Verify the signed install folders and setups
        shell: pwsh
        run: |
          $in = "$env:RUNNER_TEMP/in/sign-opencode-rune-windows"
          $publisher = [regex]::Match((Get-Content -Raw features/updater/src/windows.rs), 'pub const EXPECTED_PUBLISHER: &str = "([^"]+)";').Groups[1].Value
          if (-not $publisher) { throw 'Could not read EXPECTED_PUBLISHER from features/updater/src/windows.rs.' }
          foreach ($arch in $env:ARCHES -split ' ') {
            foreach ($name in "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch.zip", "OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-$arch-setup.exe") {
              if (-not (Test-Path -LiteralPath "$in/$name")) { throw "The signed artifact has no $name." }
            }
          }
          .github/release/opencode-rune-verify-windows.ps1 -Folders $in -Publisher $publisher
          $app = Join-Path $env:RUNNER_TEMP 'x64'
          Expand-Archive -LiteralPath "$in/OpenCode-Rune-$env:OPENCODE_RUNE_VERSION-windows-x64.zip" -DestinationPath $app
          $reported = (& "$app/opencode-desktop.exe" --version | Out-String).Trim()
          if ($reported -ne "opencode-rune $env:OPENCODE_RUNE_VERSION ($env:OPENCODE_RUNE_BUILD_CHANNEL)") { throw "opencode-desktop --version reported '$reported'." }
          "Windows: every program, library and setup is signed by $publisher ($reported)." >> $env:GITHUB_STEP_SUMMARY

  # ---- Browser engine: build (no environment, secrets, or id-token) ----------
  # Builds only when plan finds the live stable.json lacks this commit's <cef>-<rev>
  # across windows-x64, windows-arm64, macos-arm64, macos-x64, linux-x64, linux-arm64
  # (or on check/engine dispatch).

  build-engine-windows:
    needs: [plan, credentials]
    if: ${{ needs.plan.outputs.build-engine == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 60
    outputs: *arch-digests
    steps:
      - *build-checkout
      - name: Rust toolchain
        run: |
          rustup toolchain install
          [ "${{ matrix.arch }}" = x64 ] || rustup target add aarch64-pc-windows-msvc
      - name: Ensure CMake and Ninja
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if ((-not (Get-Command cmake -ErrorAction SilentlyContinue) -or -not (Get-Command ninja -ErrorAction SilentlyContinue)) -and (Test-Path -LiteralPath $vswhere)) {
            $vs = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
            if ($vs) {
              foreach ($sub in 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin', 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja') {
                $dir = Join-Path $vs $sub
                if (Test-Path -LiteralPath $dir) {
                  $env:PATH = "$dir;$env:PATH"
                  $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                }
              }
            }
          }
          $missing = @('cmake', 'ninja') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing.Count -gt 0) {
            throw "Missing required build tool(s) on Windows runner image ($($missing -join ', ')): expected on PATH or bundled with Visual Studio."
          }
          cmake --version
          ninja --version
      - name: Build and stage Windows browser engine
        shell: pwsh
        run: |
          $stageOut = Join-Path $env:RUNNER_TEMP 'stage'
          $tarOut = Join-Path $env:RUNNER_TEMP 'engine'
          New-Item -ItemType Directory -Force -Path $stageOut, $tarOut | Out-Null
          apps/browser-engine/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Out $stageOut -StageOnly
          & "$env:SystemRoot\System32\tar.exe" -cf "$tarOut/engine-windows-${{ matrix.arch }}.tar" -C "$stageOut/stage-${{ matrix.arch }}" "OpenCode Browser Engine"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pack Windows browser engine stage.' }
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-engine-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/engine
          retention-days: "7"
      - *report-digest

  build-engine-macos:
    needs: [plan, credentials]
    if: ${{ needs.plan.outputs.build-engine == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, host: blacksmith-6vcpu-macos-26 }
          - { arch: x64, host: macos-26-intel }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    outputs: *arch-digests
    steps:
      - *build-checkout
      - name: Check release engine entitlements match repository copy
        run: cmp -s .github/release/opencode-rune-engine.entitlements apps/browser-engine/entitlements.plist
      - name: Ensure CMake and Ninja
        run: |
          if ! command -v cmake > /dev/null || ! command -v ninja > /dev/null; then
            brew install cmake ninja
          fi
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Assemble unsigned macOS ${{ matrix.arch }} browser engine
        run: |
          mkdir -p "$RUNNER_TEMP/macos"
          bash apps/browser-engine/scripts/package-release.sh --arch "${{ matrix.arch }}" --assemble-only "$RUNNER_TEMP/macos/OpenCode-Browser-Engine.app.zip"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-engine-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos
          retention-days: "7"
      - *report-digest

  build-engine-linux:
    needs: [plan, credentials]
    if: ${{ needs.plan.outputs.build-engine == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, host: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, host: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
    outputs:
      digest-x64: ${{ steps.digest.outputs.digest-x64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
      sha256-x64: ${{ steps.archive-hash.outputs.sha256-x64 }}
      sha256-arm64: ${{ steps.archive-hash.outputs.sha256-arm64 }}
    steps:
      - *build-checkout
      - name: Install Linux browser engine build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build binutils bzip2 curl jq zstd libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - name: Rust toolchain
        run: rustup toolchain install
      - id: package-linux
        name: Package Linux ${{ matrix.arch }} browser engine
        run: bash apps/browser-engine/scripts/package-linux.sh --arch "${{ matrix.arch }}" "$RUNNER_TEMP/engine"
      - name: Verify Linux ${{ matrix.arch }} browser engine starts and loads a page (when userns available)
        run: |
          if ! unshare -Ur true 2>/dev/null; then
            echo "Linux unprivileged user namespaces are restricted on this runner; skipping live sandbox probe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          tar --zstd -xf "$RUNNER_TEMP/engine/OpenCode-Browser-Engine-$ENGINE_VERSION-linux-${{ matrix.arch }}.tar.zst" -C "$probe"
          python3 .github/release/opencode-rune-verify-engine-sandbox.py linux "$probe/OpenCode Browser Engine/opencode-browser-engine"
          echo "Linux ${{ matrix.arch }} browser engine: starts and loads a page (renderer sandbox state reported, not required)." >> "$GITHUB_STEP_SUMMARY"
      # Upload even when the probe fails, so a failing engine can be fetched and run elsewhere.
      - id: upload
        if: ${{ always() && steps.package-linux.outcome == 'success' }}
        uses: ./.github/release/upload
        with:
          name: build-engine-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/engine
          retention-days: "7"
      - *report-digest
      # Read the archive hash directly from the upload action's SHA256SUMS so build-linux's pin
      # and publish-engine's verified artifact are cryptographically tied to the same file.
      - id: archive-hash
        name: Report Linux ${{ matrix.arch }} engine archive sha256
        run: |
          archive="OpenCode-Browser-Engine-$ENGINE_VERSION-linux-${{ matrix.arch }}.tar.zst"
          sha=$(awk -v f="$archive" 'substr($0, 67) == f { print $1 }' "$RUNNER_TEMP/engine/SHA256SUMS")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing $archive in SHA256SUMS." >&2; exit 1; }
          echo "sha256-${{ matrix.arch }}=$sha" >> "$GITHUB_OUTPUT"

  # ---- Browser engine: sign (release environment; /.github/release/ only) ----

  sign-engine-windows:
    needs: [plan, build-engine-windows]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
      ARCHES: x64 arm64
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - name: Download unsigned Windows browser engines
        uses: ./.github/release/download
        with:
          pattern: build-engine-windows-*
          digests: >-
            build-engine-windows-x64=${{ needs.build-engine-windows.outputs.digest-x64 }}
            build-engine-windows-arm64=${{ needs.build-engine-windows.outputs.digest-arm64 }}
      - name: Unpack and verify Windows engine PE allowlist
        shell: pwsh
        run: |
          foreach ($arch in $env:ARCHES -split ' ') {
            .github/release/opencode-rune-package-engine-windows.ps1 `
              -Mode Unpack `
              -Arch $arch `
              -WorkDir "$env:RUNNER_TEMP/work" `
              -InputTar "$env:RUNNER_TEMP/in/build-engine-windows-$arch/engine-windows-$arch.tar"
          }
      - *azure-login
      - name: Sign Windows browser engines
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenCode Browser Engine
          description-url: https://github.com/anomalyco/opencode-rune
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false
      - name: Check Windows engine signatures
        shell: pwsh
        run: .github/release/opencode-rune-verify-windows.ps1 -Folders "$env:RUNNER_TEMP/work" -Publisher "Anomaly Innovations, Inc https://anoma.ly/"
      - name: Archive signed Windows browser engines
        shell: pwsh
        run: |
          foreach ($arch in $env:ARCHES -split ' ') {
            .github/release/opencode-rune-package-engine-windows.ps1 `
              -Mode Archive `
              -Arch $arch `
              -WorkDir "$env:RUNNER_TEMP/work" `
              -OutDir "$env:RUNNER_TEMP/out" `
              -Version $env:ENGINE_VERSION
          }
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-engine-windows
          path: ${{ runner.temp }}/out

  sign-engine-macos:
    needs: [plan, build-engine-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, host: blacksmith-6vcpu-macos-26 }
          - { arch: x64, host: macos-26-intel }
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
    outputs: *arch-digests
    steps:
      - *checkout-release
      - name: Download unsigned macOS ${{ matrix.arch }} browser engine
        uses: ./.github/release/download
        with:
          pattern: build-engine-macos-${{ matrix.arch }}
          digests: build-engine-macos-${{ matrix.arch }}=${{ needs.build-engine-macos.outputs[format('digest-{0}', matrix.arch)] }}
      - id: aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-rune-release
          role-session-name: opencode-rune-engine-${{ matrix.arch }}-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true
      - name: Import the certificate and notary key
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          bash .github/release/with-secrets.sh \
            APPLE_SIGNING_CERTIFICATE=shared/APPLE_SIGNING_CERTIFICATE \
            APPLE_NOTARY_KEY=shared/APPLE_NOTARY_KEY \
            -- bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
      - name: Sign, notarize, and staple macOS ${{ matrix.arch }} browser engine
        run: bash .github/release/opencode-rune-sign-engine-macos.sh "$RUNNER_TEMP/in/build-engine-macos-${{ matrix.arch }}/OpenCode-Browser-Engine.app.zip" "$RUNNER_TEMP/out" "${{ matrix.arch }}"
        env:
          SEER_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          SEER_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-engine-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
      - *report-digest

  # ---- Browser engine: verify (no environment, secrets, or id-token) ---------

  verify-engine-windows:
    needs: [plan, sign-engine-windows]
    if: ${{ !cancelled() && needs.sign-engine-windows.result == 'success' }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
      ARCHES: x64 arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.github/release/
            /features/updater/src/windows.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-engine-windows
          digests: sign-engine-windows=${{ needs.sign-engine-windows.outputs.digest }}
      - name: Verify signed Windows browser engine archives
        shell: pwsh
        run: |
          $in = "$env:RUNNER_TEMP/in/sign-engine-windows"
          $publisher = [regex]::Match((Get-Content -Raw features/updater/src/windows.rs), 'pub const EXPECTED_PUBLISHER: &str = "([^"]+)";').Groups[1].Value
          if (-not $publisher) { throw 'Could not read EXPECTED_PUBLISHER from features/updater/src/windows.rs.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'verify-engine'
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          foreach ($arch in $env:ARCHES -split ' ') {
            $name = "OpenCode-Browser-Engine-$env:ENGINE_VERSION-windows-$arch.tar.zst"
            $archive = Join-Path $in $name
            if (-not (Test-Path -LiteralPath $archive)) { throw "Signed Windows engine artifact lacks $name." }
            $dest = Join-Path $unpacked $arch
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $dest
            if ($LASTEXITCODE -ne 0) { throw "Could not unpack $name." }
            foreach ($bin in 'opencode-browser-engine.exe', 'opencode-browser-engine.dll', 'libcef.dll', 'chrome_elf.dll', 'dxcompiler.dll') {
              if (-not (Test-Path -LiteralPath (Join-Path $dest "OpenCode Browser Engine/$bin"))) {
                throw "$name lacks OpenCode Browser Engine/$bin."
              }
            }
            $exePath = Join-Path $dest 'OpenCode Browser Engine/opencode-browser-engine.exe'
            $peBytes = [IO.File]::ReadAllBytes($exePath)
            $peOff = [BitConverter]::ToInt32($peBytes, 0x3C)
            $stackReserve = [BitConverter]::ToUInt64($peBytes, $peOff + 24 + 72)
            if ($stackReserve -lt 8388608) {
              throw "$name opencode-browser-engine.exe has SizeOfStackReserve=$stackReserve (< 8 MiB)."
            }
          }
          .github/release/opencode-rune-verify-windows.ps1 -Folders $unpacked -Publisher $publisher
          "Windows browser engines ($env:ENGINE_VERSION, x64 + arm64): signed by $publisher." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify signed Windows x64 browser engine sandbox
        shell: pwsh
        run: |
          .github/release/opencode-rune-verify-engine-windows-sandbox.ps1 -EngineDir "$env:RUNNER_TEMP/verify-engine/x64/OpenCode Browser Engine"
          "Windows x64 signed browser engine: sandbox verified (CheckDllCodeSigning + Untrusted 0x0000 renderer token)." >> $env:GITHUB_STEP_SUMMARY

  verify-engine-macos:
    needs: [plan, sign-engine-macos]
    if: ${{ !cancelled() && needs.sign-engine-macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, host: blacksmith-6vcpu-macos-26 }
          - { arch: x64, host: macos-26-intel }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    env:
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: sign-engine-macos-${{ matrix.arch }}
          digests: sign-engine-macos-${{ matrix.arch }}=${{ needs.sign-engine-macos.outputs[format('digest-{0}', matrix.arch)] }}
      - name: Verify signed macOS ${{ matrix.arch }} browser engine
        run: |
          zip="$RUNNER_TEMP/in/sign-engine-macos-${{ matrix.arch }}/OpenCode-Browser-Engine-$ENGINE_VERSION-macos-${{ matrix.arch }}.zip"
          [ -f "$zip" ] || { echo "::error::Signed macOS engine artifact lacks $(basename "$zip")." >&2; exit 1; }
          check=$(mktemp -d)
          trap 'rm -rf "$check"' EXIT
          /usr/bin/ditto -x -k "$zip" "$check"
          app="$check/OpenCode Browser Engine.app"
          [ -x "$app/Contents/MacOS/opencode-browser-engine" ] || { echo "::error::Missing engine executable in $app." >&2; exit 1; }
          expected_cpu=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64)
          actual_cpu=$(lipo -archs "$app/Contents/MacOS/opencode-browser-engine")
          [ "$actual_cpu" = "$expected_cpu" ] || {
            echo "::error::$app main binary arch is '$actual_cpu', expected '$expected_cpu'." >&2; exit 1;
          }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$ENGINE_VERSION" ] || {
            echo "::error::$app is not version $ENGINE_VERSION." >&2; exit 1;
          }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          codesign --verify --deep --strict -R="anchor apple generic and certificate leaf[subject.OU] = \"$SEER_TEAM_ID\" and notarized" "$app"
          [ -f "$app/Contents/Frameworks/Chromium Embedded Framework.framework/Libraries/libcef_sandbox.dylib" ] || {
            echo "::error::Missing libcef_sandbox.dylib in $app." >&2; exit 1;
          }
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority=Developer)' >> "$GITHUB_STEP_SUMMARY"
          # macos-26-intel has no usable GPU (ANGLE's EGL display fails in the GPU process) and the macOS
          # bundle carries no SwiftShader (package-release.sh), so Chromium ends the engine ("GPU process
          # isn't usable") right after the page loads. The live probe runs where a GPU exists (arm64);
          # x64 keeps every static check above, including libcef_sandbox.dylib.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            python3 .github/release/opencode-rune-verify-engine-sandbox.py macos "$app/Contents/MacOS/opencode-browser-engine" --require-sandbox
            echo "macOS ${{ matrix.arch }} signed browser engine: sandbox verified (libcef_sandbox.dylib + sandbox_check=1)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS ${{ matrix.arch }} signed browser engine: static checks only (libcef_sandbox.dylib present); live sandbox probe runs on arm64, this runner has no usable GPU." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---- Publish browser engine: release environment; OIDC only ----------------
  # One atomic publish replacing opencode-rune/browser-engine/stable with all six targets.
  # Shared job concurrency prevents two channels from overwriting the same version with new hashes.

  publish-engine:
    needs: [plan, build-engine-linux, sign-engine-macos, verify-engine-macos, sign-engine-windows, verify-engine-windows]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.build-engine == 'true'
      && needs.plan.outputs.channel != 'check'
      && needs.build-engine-linux.result == 'success'
      && needs.sign-engine-macos.result == 'success'
      && needs.verify-engine-macos.result == 'success'
      && needs.sign-engine-windows.result == 'success'
      && needs.verify-engine-windows.result == 'success' }}
    concurrency:
      group: opencode-rune-browser-engine-publish
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      ENGINE_VERSION: ${{ needs.plan.outputs.engine-version }}
      ENGINE_RELEASE_VERSION: ${{ needs.plan.outputs.engine-release-version }}
      LINUX_X64_SHA256: ${{ needs.build-engine-linux.outputs.sha256-x64 }}
      LINUX_ARM64_SHA256: ${{ needs.build-engine-linux.outputs.sha256-arm64 }}
      NOTES_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: sign-engine-windows
          digests: sign-engine-windows=${{ needs.sign-engine-windows.outputs.digest }}
          folder: win
      - uses: ./.github/release/download
        with:
          pattern: sign-engine-macos-*
          digests: >-
            sign-engine-macos-arm64=${{ needs.sign-engine-macos.outputs.digest-arm64 }}
            sign-engine-macos-x64=${{ needs.sign-engine-macos.outputs.digest-x64 }}
          folder: mac
      - uses: ./.github/release/download
        with:
          pattern: build-engine-linux-*
          digests: >-
            build-engine-linux-x64=${{ needs.build-engine-linux.outputs.digest-x64 }}
            build-engine-linux-arm64=${{ needs.build-engine-linux.outputs.digest-arm64 }}
          folder: linux
      - name: Publish browser engines atomically
        run: |
          win_x64="$RUNNER_TEMP/win/sign-engine-windows/OpenCode-Browser-Engine-$ENGINE_VERSION-windows-x64.tar.zst"
          win_arm64="$RUNNER_TEMP/win/sign-engine-windows/OpenCode-Browser-Engine-$ENGINE_VERSION-windows-arm64.tar.zst"
          mac_arm64="$RUNNER_TEMP/mac/sign-engine-macos-arm64/OpenCode-Browser-Engine-$ENGINE_VERSION-macos-arm64.zip"
          mac_x64="$RUNNER_TEMP/mac/sign-engine-macos-x64/OpenCode-Browser-Engine-$ENGINE_VERSION-macos-x64.zip"
          linux_x64_name="OpenCode-Browser-Engine-$ENGINE_VERSION-linux-x64.tar.zst"
          linux_x64="$RUNNER_TEMP/linux/build-engine-linux-x64/$linux_x64_name"
          linux_arm64_name="OpenCode-Browser-Engine-$ENGINE_VERSION-linux-arm64.tar.zst"
          linux_arm64="$RUNNER_TEMP/linux/build-engine-linux-arm64/$linux_arm64_name"
          check_linux_sha() {
            local arch=$1 name=$2 expected=$3 sums=$4 actual
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid LINUX_${arch}_SHA256 '$expected'." >&2
              exit 1
            }
            actual=$(awk -v f="$name" 'substr($0, 67) == f { print $1 }' "$sums")
            [[ "$actual" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Missing or invalid SHA256SUMS entry for $name ('$actual')." >&2
              exit 1
            }
            [ "$actual" = "$expected" ] || {
              echo "::error::Linux $arch engine SHA256SUMS entry '$actual' differs from job output '$expected'." >&2
              exit 1
            }
          }
          check_linux_sha x64 "$linux_x64_name" "$LINUX_X64_SHA256" "$RUNNER_TEMP/linux/build-engine-linux-x64/SHA256SUMS"
          check_linux_sha arm64 "$linux_arm64_name" "$LINUX_ARM64_SHA256" "$RUNNER_TEMP/linux/build-engine-linux-arm64/SHA256SUMS"
          bash .github/release/opencode-rune-check-engine.sh --assert-not-complete --version "$ENGINE_RELEASE_VERSION"
          jq -n \
            --arg version "$ENGINE_RELEASE_VERSION" \
            --arg notes_url "$NOTES_URL" \
            '{channel: "stable", version: $version, allow_prerelease: true, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/engine-release.json"
          bash .github/release/release-client.sh publish \
            --app opencode-rune \
            --artifact browser-engine \
            --release "$RUNNER_TEMP/engine-release.json" \
            --target "windows-x64=$win_x64" \
            --target "windows-arm64=$win_arm64" \
            --target "macos-arm64=$mac_arm64" \
            --target "macos-x64=$mac_x64" \
            --target "linux-x64=$linux_x64" \
            --target "linux-arm64=$linux_arm64" \
            --out "$RUNNER_TEMP/engine-manifest.json" \
            --verify-downloads
          {
            echo '### Browser Engine Manifest'; echo '```json'; cat "$RUNNER_TEMP/engine-manifest.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Gate: verify live browser-engine index before publishing desktop ------
  # No environment, secrets, or id-token; checks /.github/release/ gate script against hardcoded
  # stable.json and asserts source.rs names the same URL.

  verify-engine-published:
    needs: [plan, build-engine-linux, publish-engine, build-linux]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.channel == 'dev'
      && needs.plan.outputs.build-desktop == 'true'
      && needs.build-linux.result == 'success'
      && (needs.plan.outputs.build-engine != 'true' || needs.publish-engine.result == 'success') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.github/release/
            /crates/browser-pane/src/source.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify live browser engine index and Linux pins
        env:
          ENGINE_RELEASE_VERSION: ${{ needs.plan.outputs.engine-release-version }}
          EXPECTED_LINUX_X64_SHA256: ${{ needs.plan.outputs.build-engine == 'true' && needs.build-engine-linux.outputs.sha256-x64 || needs.plan.outputs.linux-x64-sha256 }}
          PINNED_LINUX_X64_SHA256: ${{ needs.build-linux.outputs.linux-x64-engine-sha256 }}
          EXPECTED_LINUX_ARM64_SHA256: ${{ needs.plan.outputs.build-engine == 'true' && needs.build-engine-linux.outputs.sha256-arm64 || needs.plan.outputs.linux-arm64-sha256 }}
          PINNED_LINUX_ARM64_SHA256: ${{ needs.build-linux.outputs.linux-arm64-engine-sha256 }}
        run: |
          check_pin() {
            local arch=$1 expected=$2 pinned=$3
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid EXPECTED_LINUX_${arch}_SHA256 '$expected'." >&2
              exit 1
            }
            [[ "$pinned" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid PINNED_LINUX_${arch}_SHA256 '$pinned'." >&2
              exit 1
            }
            [ "$pinned" = "$expected" ] || {
              echo "::error::Linux $arch app pinned '$pinned', expected '$expected'." >&2
              exit 1
            }
          }
          check_pin x64 "$EXPECTED_LINUX_X64_SHA256" "$PINNED_LINUX_X64_SHA256"
          check_pin arm64 "$EXPECTED_LINUX_ARM64_SHA256" "$PINNED_LINUX_ARM64_SHA256"
          bash .github/release/opencode-rune-check-engine.sh \
            --assert-published \
            --version "$ENGINE_RELEASE_VERSION" \
            --linux-x64-sha256 "$PINNED_LINUX_X64_SHA256" \
            --linux-arm64-sha256 "$PINNED_LINUX_ARM64_SHA256" \
            --source-rs crates/browser-pane/src/source.rs

  # ---- Publish desktop: release environment; OIDC only -----------------------
  # A channel has one current release, and publishing replaces it whole (targets included), so
  # all six builds go out in one request after the package, signing, and engine checks pass.

  publish-desktop:
    needs: [plan, build-linux, sign-macos, verify-macos, verify-windows, sign-windows-setup, verify-engine-published]
    # Explicit results: when the engine is already published, publish-engine is skipped, and the
    # implicit success() would skip this job too because a skipped job is among its ancestors.
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.channel == 'dev'
      && needs.plan.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.sign-macos.result == 'success'
      && needs.verify-macos.result == 'success'
      && needs.verify-windows.result == 'success'
      && needs.sign-windows-setup.result == 'success'
      && needs.verify-engine-published.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.release-channel }}
      NOTES_URL: ${{ needs.plan.outputs.notes-url }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with: &download-macos
          pattern: sign-opencode-rune-macos-*
          digests: >-
            sign-opencode-rune-macos-x64=${{ needs.sign-macos.outputs.digest-x64 }}
            sign-opencode-rune-macos-arm64=${{ needs.sign-macos.outputs.digest-arm64 }}
          folder: macos
      - uses: ./.github/release/download
        with: &download-linux
          pattern: build-opencode-rune-linux-*
          digests: >-
            build-opencode-rune-linux-x64=${{ needs.build-linux.outputs.digest-x64 }}
            build-opencode-rune-linux-arm64=${{ needs.build-linux.outputs.digest-arm64 }}
          folder: linux
      - uses: ./.github/release/download
        with: &download-windows
          pattern: sign-opencode-rune-windows
          digests: sign-opencode-rune-windows=${{ needs.sign-windows-setup.outputs.digest }}
          folder: windows
      - name: Publish Brocode desktop release
        run: |
          targets=()
          for arch in x64 arm64; do
            mac="$RUNNER_TEMP/macos/sign-opencode-rune-macos-$arch/OpenCode-Rune-$VERSION-macos-$arch"
            win="$RUNNER_TEMP/windows/sign-opencode-rune-windows/OpenCode-Rune-$VERSION-windows-$arch"
            linux="$RUNNER_TEMP/linux/build-opencode-rune-linux-$arch/OpenCode-Rune-$VERSION-linux-$arch"
            targets+=(--target "macos-$arch=$mac.zip" --target "macos-$arch-dmg=$mac.dmg")
            targets+=(--target "windows-$arch=$win.zip" --target "windows-$arch-setup=$win-setup.exe")
            for ext in AppImage deb rpm; do
              targets+=(--target "linux-$arch-${ext,,}=$linux.$ext")
            done
          done
          jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg notes_url "$NOTES_URL" \
            '{channel: $channel, version: $version, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/release.json"
          bash .github/release/release-client.sh publish \
            --app opencode \
            --artifact desktop-rune \
            --release "$RUNNER_TEMP/release.json" \
            "${targets[@]}" \
            --out "$RUNNER_TEMP/manifest.json" \
            --verify-downloads
          {
            echo '### Desktop Manifest'; echo '```json'; cat "$RUNNER_TEMP/manifest.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Tag and GitHub release: last, once the release service published ------
  # Tags v0.0.0-dev-<n> on the released commit and mirrors the signed files to its GitHub release,
  # marked latest, with the built-in token; a failed run leaves no tag. Tags start nothing. A check
  # run pushes and deletes a throwaway v0.0.0-test-<run> tag to prove the token can tag.

  github:
    name: Tag and GitHub release
    environment: release
    needs: [plan, build-linux, publish-desktop, sign-macos, verify-macos, sign-windows-setup, verify-windows, build-engine-linux, verify-engine-macos, verify-engine-windows]
    if: >-
      ${{ !cancelled() && (
        (needs.plan.outputs.channel == 'dev' && needs.publish-desktop.result == 'success')
        || (needs.plan.outputs.channel == 'check' && needs.verify-windows.result == 'success'
            && needs.verify-macos.result == 'success' && needs.build-linux.result == 'success'
            && needs.build-engine-linux.result == 'success'
            && needs.verify-engine-macos.result == 'success'
            && needs.verify-engine-windows.result == 'success')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.plan.outputs.release-version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Credentials stay so the job can push the tag; it runs nothing beyond .github/release/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
      - name: Tag
        env:
          TAG_TEST: ${{ needs.plan.outputs.channel == 'check' && '1' || '' }}
        run: bash .github/release/tag-release.sh
      - if: needs.plan.outputs.channel == 'dev'
        uses: ./.github/release/download
        with: *download-macos
      - if: needs.plan.outputs.channel == 'dev'
        uses: ./.github/release/download
        with: *download-linux
      - if: needs.plan.outputs.channel == 'dev'
        uses: ./.github/release/download
        with: *download-windows
      - name: GitHub release
        if: needs.plan.outputs.channel == 'dev'
        run: bash .github/release/publish-github-release.sh "$RUNNER_TEMP"/macos/sign-opencode-rune-macos-{x64,arm64} "$RUNNER_TEMP/windows/sign-opencode-rune-windows" "$RUNNER_TEMP"/linux/build-opencode-rune-linux-{x64,arm64}
