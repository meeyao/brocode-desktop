name: Brocode Web Build

# Builds the browser build (apps/web: the desktop app as wasm with WebGPU) and uploads the
# static folder as an artifact, to keep dev's web build honest and to give a bundle to try. It
# deploys nothing: serve the folder locally (`pwsh scripts/web.ps1 -NoBuild`, or any static
# server) and open it in Chrome or Edge.
#
# Three times a day, and only when dev moved since the last green run; or by hand. Not on every
# push: dev moves dozens of times a day, and every push's own wasm32 check runs before it.

# brocode: upstream runs this on Blacksmith runners this fork lacks; run by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: opencode-rune-web
  cancel-in-progress: true

jobs:
  # Dev only: a dispatch from another branch builds nothing (web needs this job).
  moved:
    if: github.ref == 'refs/heads/dev'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow opencode-rune-web.yml --branch dev --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev hasn't moved since the last green run ($last)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: moved
    if: needs.moved.outputs.build == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      WASI_SDK_VERSION: "34"
      # wasi-sdk-34.0-x86_64-linux.tar.gz, as its release lists it.
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml picks the toolchain.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-wasm32
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # Luau's C++ builds for the web with WASI SDK's clang (LLVM and the WASI sysroot in one).
      - id: wasi-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-${{ env.WASI_SDK_SHA256 }}
      - name: WASI SDK
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: |
          file="wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/$file"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
      - name: WASI SDK path
        run: |
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux/bin/clang" --version
      - name: wasm-bindgen version
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}-linux
      - name: wasm-bindgen
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      # The terminal's libghostty-vt for wasm32, and the Zig that builds it (crates/terminal/build.rs),
      # outside target/: about 2.5 minutes when it isn't cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/seer/ghostty-vt
          key: ghostty-vt-wasm32-${{ hashFiles('crates/terminal/build.rs', 'crates/terminal/build_support.rs') }}
      - name: Build
        shell: pwsh
        run: scripts/web.ps1 -NoServe -Out "$env:RUNNER_TEMP/web"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opencode-rune-web-${{ github.sha }}
          path: ${{ runner.temp }}/web
          retention-days: 14
