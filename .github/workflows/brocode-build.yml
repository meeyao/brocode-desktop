name: Brocode desktop builds

# Unsigned, ad-hoc builds of the branded desktop app for Windows x64, macOS arm64 and
# macOS x64. workflow_dispatch only; uploads zips as workflow artifacts, publishes nothing.
#
#   gh workflow run brocode-build.yml -R meeyao/brocode-desktop --ref dev
#
# macOS artifacts are ad-hoc signed, not notarized: after downloading, right-click > Open,
# or `xattr -dr com.apple.quarantine Brocode.app`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: false
        default: dev

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile release-thin --locked -p brocode-desktop --no-default-features --features knobs
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release-thin/brocode-desktop.exe out/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath brocode-desktop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brocode-desktop-windows-x64
          path: brocode-desktop-windows-x64.zip
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: nasm
        run: brew install nasm
      - name: Brocode icns
        run: |
          mkdir -p /tmp/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s apps/desktop/assets/icon/icon-1024.png --out "/tmp/icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) apps/desktop/assets/icon/icon-1024.png --out "/tmp/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/icon.iconset -o apps/desktop/assets/icon.icns
      - name: Build arm64
        env:
          OPENCODE_RUNE_VERSION: 0.0.0-dev-${{ github.run_number }}
          OPENCODE_RUNE_BUILD_CHANNEL: local
          OPENCODE_RUNE_PROFILE: release-thin
          OPENCODE_RUNE_PGO_USE: "0"
          OPENCODE_RUNE_TARGET: aarch64-apple-darwin
          OPENCODE_RUNE_ICON: ${{ github.workspace }}/apps/desktop/assets/icon.icns
          OPENCODE_RUNE_SYMBOLS: ${{ runner.temp }}/symbols-arm64
        run: |
          apps/desktop/scripts/build-app.sh "$PWD/out-arm64"
          ditto -c -k --sequesterRsrc --keepParent "$PWD/out-arm64/Brocode.app" brocode-desktop-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brocode-desktop-macos-arm64
          path: brocode-desktop-macos-arm64.zip
          retention-days: 14
      - name: Build x64
        env:
          OPENCODE_RUNE_VERSION: 0.0.0-dev-${{ github.run_number }}
          OPENCODE_RUNE_BUILD_CHANNEL: local
          OPENCODE_RUNE_PROFILE: release-thin
          OPENCODE_RUNE_PGO_USE: "0"
          OPENCODE_RUNE_TARGET: x86_64-apple-darwin
          OPENCODE_RUNE_ICON: ${{ github.workspace }}/apps/desktop/assets/icon.icns
          OPENCODE_RUNE_SYMBOLS: ${{ runner.temp }}/symbols-x64
        run: |
          apps/desktop/scripts/build-app.sh "$PWD/out-x64"
          ditto -c -k --sequesterRsrc --keepParent "$PWD/out-x64/Brocode.app" brocode-desktop-macos-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brocode-desktop-macos-x64
          path: brocode-desktop-macos-x64.zip
          retention-days: 14

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p pub
          unzip -oq dist/brocode-desktop-windows-x64/brocode-desktop-windows-x64.zip -d pub/windows
          cp pub/windows/brocode-desktop.exe pub/brocode-desktop-win-x64.exe
          cp dist/brocode-desktop-macos-arm64/brocode-desktop-macos-arm64.zip pub/brocode-desktop-darwin-arm64.zip
          cp dist/brocode-desktop-macos-x64/brocode-desktop-macos-x64.zip pub/brocode-desktop-darwin-x64.zip
      - name: Publish to dl.apibrother.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 20b0a3b3121624c5e42cbab0910872ba
        run: bash scripts/publish-desktop.sh pub
