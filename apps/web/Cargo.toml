[package]
name = "opencode-web"
version = "0.0.1"
description = "Brocode in a browser: thin wasm32/WebGPU entry over opencode-desktop"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "opencode_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
brocode-desktop = { path = "../desktop", default-features = false }
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-storage = { path = "../../crates/opencode-storage" }
opencode-ui = { path = "../../crates/opencode-ui" }
rune = { workspace = true, features = ["avif"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "History", "Location", "Navigator", "PopStateEvent", "UrlSearchParams", "Window"] }

[lints]
workspace = true
