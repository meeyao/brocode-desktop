[package]
name = "win-install"
version = "0.0.1"
description = "Brocode's per-user Windows install: the product's identity, its Start menu and desktop shortcuts, the uninstall entry, URL schemes, closing running copies, and the exe's icon, version and manifest resources"
edition.workspace = true
license.workspace = true

[features]
# For build scripts: the exe's icon, version and manifest resources (`resources::embed`).
resources = ["dep:winresource"]

[dependencies]
winresource = { version = "0.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
serde_json.workspace = true
windows-registry = "0.6"

[lints]
workspace = true
