[package]
name = "opencode-feature-restore"
version = "0.0.1"
description = "Window state restoration, composer drafts, blob attachments, timeline places, boot previews, offline transcript copies, and draft undo persistence for Brocode"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kernel = { path = "../../crates/opencode-kernel" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-runtime = { path = "../../crates/opencode-runtime" }
opencode-servers = { path = "../../crates/opencode-servers" }
opencode-storage = { path = "../../crates/opencode-storage" }
opencode-ui = { path = "../../crates/opencode-ui" }
rune.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
