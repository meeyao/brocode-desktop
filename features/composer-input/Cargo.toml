[package]
name = "opencode-feature-composer-input"
version = "0.0.1"
description = "Composer attachments, file uploads, dropzone overlay, suggestions state machine, history popover, slash commands, and prompt history for Brocode"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kernel = { path = "../../crates/opencode-kernel" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-platform = { path = "../../crates/opencode-platform" }
opencode-runtime = { path = "../../crates/opencode-runtime" }
opencode-search = { path = "../../crates/opencode-search" }
opencode-ui = { path = "../../crates/opencode-ui" }
rune.workspace = true
rune-kit.workspace = true
rune-theme-opencode.workspace = true
serde_json.workspace = true
session-view = { path = "../../crates/session-view" }

[lints]
workspace = true
