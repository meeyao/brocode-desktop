[package]
name = "opencode-feature-find"
version = "0.0.1"
description = "Session timeline Find (Cmd/Ctrl+F) state machine, incremental transcript search index, match highlighting, and find bar for Brocode"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
memchr = "2"
opencode-i18n = { path = "../../crates/opencode-i18n" }
opencode-kernel = { path = "../../crates/opencode-kernel" }
opencode-kit = { path = "../../crates/opencode-kit" }
opencode-search = { path = "../../crates/opencode-search" }
opencode-ui = { path = "../../crates/opencode-ui" }
rune.workspace = true
rune-kit = { workspace = true, features = ["markdown"] }
rune-theme-opencode.workspace = true
session-view = { path = "../../crates/session-view" }

[lints]
workspace = true
