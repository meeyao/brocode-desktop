#:schema ../plugin.schema.json
id = "updater"
name = "Updater"
version = "1.0.0"
contract = "1.7"
description = "Keeps Brocode current: the titlebar's Update pill, Settings > Updates, Check for Updates…, and What's new after an update"
app = "app.luau"

# Whether What's New shows after an update.
[[stores]]
name = "releaseNotes"

# Opt-in: install downloaded updates automatically when Brocode quits (opencode#66501).
[[stores]]
name = "installOnQuit"

# The version whose What's New was last shown or skipped, and its commit.
[[stores]]
name = "seen"

[[settings_search]]
id = "settings-release-notes"
page = "general"
title = "Release notes"
description = "Show What's New popups after updates"

[[settings_search]]
id = "settings-install-on-quit"
page = "general"
title = "Install updates on quit"
description = "Automatically install downloaded updates when you quit Brocode"

[[settings_search]]
id = "settings-check-updates"
page = "general"
title = "Check for updates"
description = "Manually check for updates and install if available"
