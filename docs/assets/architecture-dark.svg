<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" fill="none" role="img" aria-label="Brocode four-tier architecture diagram">
  <!-- Outer OpenCode diagram surface -->
  <rect x="0.5" y="0.5" width="959" height="485" rx="10" fill="#141414" stroke="#242424" stroke-width="1"/>

  <!-- Connectors between left tiers -->
  
      <line x1="84" y1="114" x2="84" y2="131" stroke="#3a3a3a" stroke-width="1.2"/>
      <polygon points="80.5,130 87.5,130 84,136" fill="#666666"/>
  
      <line x1="84" y1="222" x2="84" y2="239" stroke="#3a3a3a" stroke-width="1.2"/>
      <polygon points="80.5,238 87.5,238 84,244" fill="#666666"/>
  
      <line x1="84" y1="352" x2="84" y2="369" stroke="#3a3a3a" stroke-width="1.2"/>
      <polygon points="80.5,368 87.5,368 84,374" fill="#666666"/>

  <!-- Quiet edge labels between tiers -->
  <text x="98" y="129" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">Need native engines or GPU shaders</text>
  <text x="98" y="237" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">Dependencies flow strictly downward (never across features)</text>
  <text x="98" y="367" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">Composed into native and browser host shells</text>

  <!-- Non-crossing smooth Bezier connectors to external boundaries -->
  <path d="M 602 268 C 646 268, 646 96, 685 96" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><polygon points="684,92.5 690,96 684,99.5" fill="#666666"/>
      <rect x="627.5" y="173" width="37" height="18" rx="4" fill="#141414"/>
      <text x="646" y="185.5" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">kit</text>
  <path d="M 602 316 C 646 316, 646 270, 685 270" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><polygon points="684,266.5 690,270 684,273.5" fill="#666666"/>
      <rect x="620.5" y="284" width="51" height="18" rx="4" fill="#141414"/>
      <text x="646" y="296.5" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">embed</text>
  <path d="M 602 416 C 646 416, 646 404, 685 404" stroke="#3a3a3a" stroke-width="1.2" fill="none"/><polygon points="684,400.5 690,404 684,407.5" fill="#666666"/>
      <rect x="617" y="401" width="58" height="18" rx="4" fill="#141414"/>
      <text x="646" y="413.5" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#808080">render</text>

  <!-- ==================== TIER 1: plugins/* ==================== -->
  <g>
    <rect x="28" y="28" width="574" height="86" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="48" y="57" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#eeeeee">plugins/*</text>
    <text x="140" y="57" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#808080">Tier 1 · Default lane</text>
    <text x="582" y="57" text-anchor="end" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#aeaeae">0 ms hot reload</text>
    <text x="48" y="80" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#aeaeae">--!strict Luau plugins targeting opencode-plugin-spec (contract.json).</text>
    <text x="48" y="99" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080">Panels, dialogs, commands, slash actions, and server sources without touching Rust.</text>
  </g>

  <!-- ==================== TIER 2: features/* ==================== -->
  <g>
    <rect x="28" y="136" width="574" height="86" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="48" y="165" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#eeeeee">features/*</text>
    <text x="148" y="165" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#808080">Tier 2 · Parallel crates</text>
    <text x="582" y="165" text-anchor="end" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#808080">&amp;mut dyn *Host</text>
    <text x="48" y="188" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#aeaeae">Decoupled Rust features with explicit state machines and zero cross-feature deps.</text>
    <text x="48" y="207" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080">Files, review, find, inbox, mentions, terminal, office, dictation, settings, and the Easter egg.</text>
  </g>

  <!-- ==================== TIER 3: crates/* ==================== -->
  <g>
    <rect x="28" y="244" width="574" height="108" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="48" y="272" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#eeeeee">crates/*</text>
    <text x="132" y="272" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#808080">Tier 3 · Core and embeddable libraries</text>
    
    <rect x="48" y="286" width="131" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="113.5" y="301.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">opencode-kernel</text>
    <rect x="187" y="286" width="103" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="238.5" y="301.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">opencode-ui</text>
    <rect x="298" y="286" width="138" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="367" y="301.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">opencode-runtime</text>
    <rect x="444" y="286" width="138" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="513" y="301.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">opencode-storage</text>
    
    <rect x="48" y="317" width="113" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="104.5" y="332.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">session-view</text>
    <rect x="169" y="317" width="113" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="225.5" y="332.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">opencode-kit</text>
    <rect x="290" y="317" width="92" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="336" y="332.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">code-view</text>
    <rect x="390" y="317" width="99" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="439.5" y="332.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">rune-parts</text>
    <rect x="497" y="317" width="85" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="539.5" y="332.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">terminal</text>
  </g>

  <!-- ==================== TIER 4: apps/* ==================== -->
  <g>
    <rect x="28" y="374" width="574" height="84" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="48" y="402" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#eeeeee">apps/*</text>
    <text x="116" y="402" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#808080">Tier 4 · Native, WebGPU, installer, and lazy CEF sidecar</text>
    
    <rect x="48" y="418" width="118" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="107" y="433.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">apps/desktop</text>
    <rect x="174" y="418" width="89" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="218.5" y="433.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">apps/web</text>
    <rect x="271" y="418" width="133" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="337.5" y="433.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">apps/installer</text>
    <rect x="412" y="418" width="170" height="24" rx="5" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="497" y="433.5" text-anchor="middle" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#aeaeae">apps/browser-engine</text>
  </g>

  <!-- ==================== RIGHT COLUMN: EXTERNAL BOUNDARIES ==================== -->
  <!-- 1. OpenCode server -->
  <g>
    <rect x="690" y="40" width="242" height="112" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="708" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eeeeee">OpenCode server</text>
    <text x="708" y="90" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#aeaeae">127.0.0.1:4096</text>
    <text x="708" y="110" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080">Auto-discovers local server or</text>
    <text x="708" y="128" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080"><tspan font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11">service.json</tspan> · never auto-started</text>
  </g>

  <!-- 2. Other Rune apps -->
  <g>
    <rect x="690" y="214" width="242" height="112" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="708" y="242" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eeeeee">Other Rune apps</text>
    <text x="708" y="264" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#aeaeae">Embed live timelines, diffs, and</text>
    <text x="708" y="281" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#aeaeae">terminals in any Rune host via</text>
    <text x="708" y="304" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#808080">session-view + opencode-kit</text>
  </g>

  <!-- 3. Rune -->
  <g>
    <rect x="690" y="350" width="242" height="108" rx="8" fill="#1b1b1b" stroke="#2e2e2e" stroke-width="1"/>
    <text x="708" y="378" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#eeeeee">Rune</text>
    <text x="752" y="378" font-family="'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#808080">anomalyco/rune</text>
    <text x="708" y="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#aeaeae">Metal, DX12, Vulkan, and WebGPU</text>
    <text x="708" y="420" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080">Windfoil GPU outline text</text>
    <text x="708" y="439" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#808080">Headless --snap and --tree</text>
  </g>
</svg>
